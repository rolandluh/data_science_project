<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EV Charging Station Placement</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>EV Charging Station Placement</h1>
  </header>
  <div id="map"></div>
  <div id="dock">
    <label>
      Study area
      <select id="region">
        <option value="circle">Circle on map</option>
      </select>
    </label>
    <label title="Click the map to set the study area center">
      Study area radius (km)
      <input id="radius" type="number" min="1" max="50" value="10">
    </label>
    <label>
      Charging technology
      <select id="technology">
        <option value="both">AC + DC</option>
        <option value="ac">AC</option>
        <option value="dc">DC</option>
      </select>
    </label>
    <label title="Straight-line distance residents should travel to a public charger">
      Max access distance (km)
      <input id="access" type="number" min="1" max="20" value="10">
    </label>
  </div>
  <aside id="layers">
    <h2>Layers</h2>
    <h3>Charging stations</h3>
    <label class="switch-row"><span>Register only</span><span class="switch"><input id="show-register" type="checkbox" checked><span class="knob"></span></span></label>
    <label class="switch-row"><span>Register + historic</span><span class="switch"><input id="show-matched" type="checkbox" checked><span class="knob"></span></span></label>
    <label class="switch-row"><span>Historic only</span><span class="switch"><input id="show-historic" type="checkbox" checked><span class="knob"></span></span></label>
    <h3>Parking</h3>
    <label class="switch-row"><span>MobiData</span><span class="switch"><input id="parking" type="checkbox" checked><span class="knob"></span></span></label>
    <label class="switch-row"><span>OpenStreetMap</span><span class="switch"><input id="parking-osm" type="checkbox"><span class="knob"></span></span></label>
    <h3>Context</h3>
    <label class="switch-row"><span>Population heatmap</span><span class="switch"><input id="population" type="checkbox"><span class="knob"></span></span></label>
    <label class="switch-row"><span>EV cars by municipality</span><span class="switch"><input id="ev" type="checkbox"><span class="knob"></span></span></label>
    <h3>Map</h3>
    <label class="switch-row"><span>Study area</span><span class="switch"><input id="show-area" type="checkbox" checked><span class="knob"></span></span></label>
    <label class="switch-row"><span>State borders</span><span class="switch"><input id="show-borders" type="checkbox" checked><span class="knob"></span></span></label>
    <label class="switch-row"><span>Legend</span><span class="switch"><input id="show-legend" type="checkbox" checked><span class="knob"></span></span></label>
  </aside>
  <div id="zoom-slider">
    <input id="zoom" type="range" min="6" max="19" step="1">
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="app.js"></script>
</body>
</html>
